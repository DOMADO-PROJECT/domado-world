<title id="title">DOMADO WORLD · 대표 성능 지표 6개</title>
<desc id="desc">1~7차에서 고른 대표 성능 지표 6개입니다. 모바일 LCP 6.92초에서 3.46초, 첫 화면 총 전송량 1,606,640B에서 433,644B, 메인 JS gzip 214,803B에서 114,888B, 데스크톱 PSI TBT 860ms에서 0ms, 모바일 패널 뒤 drawImage 36,720에서 238회/2초, 120Hz 모바일의 20ms 초과 프레임 간격 22에서 0회/10초로 줄었습니다. 모바일 LCP·전송량은 각 5회 중앙값이며 데스크톱 TBT는 별도 측정으로 개선 후 2회 모두 0ms였습니다. 4차 JS는 2026년 8월 4일 당시 빌드 기록입니다. 6차는 당시 3회 중앙값이며 일시정지 상태만 비교합니다. 1차는 10초 관측 구간에 한정합니다. 각 행에 최적화 방법을 표시하며 모바일 LCP에는 글꼴·초기 자산 최적화, 데스크톱 TBT에는 월드 초기화 유예를 연결합니다. 각 항목의 개선 전을 100으로 놓으며 개선율을 합산하지 않습니다. 2026년 7~8월의 서로 다른 환경 기록이며 현재 배포 실측이나 전체 성능 개선율이 아닙니다. 7차 모바일 FCP는 2.10초에서 2.40초로 증가했습니다. 값과 감소율은 고정하고 막대만 약 2.3초 동안 최종 비율로 줄인 뒤 오래 유지하는 12초 모션을 반복합니다. 중간 길이는 측정값이 아닙니다. 모션 감소 설정에서는 최종 비율을 정적으로 표시합니다.</desc>
