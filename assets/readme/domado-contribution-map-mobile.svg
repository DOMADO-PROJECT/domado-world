<title id="title">DOMADO WORLD · 직접 기여한 범위와 외부 원본</title>
<desc id="desc">제품 콘셉트와 정보 구조, 진입 경로, React 인터페이스, 월드 구성과 픽셀 가공, 상호작용·게임 시스템과 사운드 수명 주기를 직접 설계하고 구현했습니다. 픽셀 원화는 Cute Fantasy by Kenmi, 외부 음원은 CC0와 Pixabay 출처이며 자세한 이용 범위는 NOTICE에 기록했습니다. 원본 제작과 직접 기여한 작업을 구분한 정적 도표입니다.</desc>
