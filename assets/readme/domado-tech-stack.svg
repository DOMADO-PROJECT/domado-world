<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1016" viewBox="0 0 1280 1016" role="img" aria-labelledby="title desc" xml:lang="ko">
<title id="title">DOMADO WORLD · React와 Canvas의 상태 경계</title>
<desc id="desc">Canvas GameWorld의 프레임 상태는 ref에, 화면 상태는 React App에 둡니다. 월드의 onInteract, QuickMenu, MobileHome은 openSection으로 연결됩니다. App은 paused와 renderSuspended를 전달합니다. PANELS는 지연 로드하며 PortfolioViewer는 외부 세로 스크롤 앱을 iframe으로 표시하고 history와 postMessage의 origin/source를 확인합니다. Gemini는 Vercel /api/gemini를 경유하고 Supabase와 EmailJS는 브라우저에서 직접 요청합니다. Web Audio는 필요할 때 디코딩하고 버퍼를 재사용합니다. 12초 모션은 정보 패널 열기·닫기와 메뉴에서 포트폴리오 열기를 예시로 보여줍니다. 하단 세 경로는 각 패널에서 발생하는 별도 요청을 함께 보여주며 실제 실행 시간이나 RAF 전체 중단을 뜻하지 않습니다. 브라우저와 서버·외부 서비스 영역을 구분하고, 신호가 도착한 카드를 잠깐 강조합니다. 모션 감소 설정에서도 구성 요소와 화살표를 읽을 수 있습니다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#566270" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<filter id="node-shadow" x="-5%" y="-15%" width="110%" height="135%" color-interpolation-filters="sRGB"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#191f28" flood-opacity=".06"/></filter></defs>
<style>
text{font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
.numeric{font-variant-numeric:tabular-nums}
.wire{fill:none;stroke:#566270;stroke-width:1.8;stroke-linejoin:round;marker-end:url(#arrow)}
.both{marker-start:url(#arrow)}
.node-pulse{fill:none;stroke:#33664e;stroke-width:1.8;opacity:0;pointer-events:none}
.trace{fill:none;stroke:#33664e;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;opacity:0}
.trace.secondary{stroke-width:2.2}
@media (prefers-reduced-motion: no-preference){
 .trace{animation:signal 12s linear infinite both;animation-delay:var(--at)}
 .node-pulse{animation:node-arrival 12s linear infinite both;animation-delay:var(--at)}
}
/* 하단 세 요청은 각각 패널에서 출발하는 독립 예시다. 길이가 달라도 도착 강조 시점은 같다. */
@keyframes signal{0%{stroke-dashoffset:1;opacity:0}.2%{opacity:1}6%,7%{stroke-dashoffset:0;opacity:1}9%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes node-arrival{0%,6%,15%,100%{opacity:0}7%,11%{opacity:1}}
@media (prefers-reduced-motion: reduce){.trace,.node-pulse{animation:none;opacity:0}}
</style>
