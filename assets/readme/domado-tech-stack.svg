<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1024" viewBox="0 0 1120 1024" role="img" aria-labelledby="title desc" lang="ko">
  <title id="title">DOMADO — 화면은 React, 게임 루프는 Canvas</title>
  <desc id="desc">브라우저의 React 19 App은 화면 전환·패널·퀘스트 상태를, Canvas 2D GameWorld는 매 프레임 좌표·충돌·카메라를 관리합니다. App은 일시정지를 전달하고 GameWorld는 근접 대상이 바뀔 때 UI에 알립니다. Web Audio는 효과음 버퍼 재사용과 BGM 교차 전환을 맡고 Fullscreen·Orientation API는 전체화면과 화면 방향을 제어합니다. ChatPanel은 Vercel의 POST /api/gemini를 통해 Gemini를 호출하며 키 보관·입력 제한·오류 응답은 서버가 처리합니다. 방명록과 연락 폼은 입력 검사·DOMPurify 뒤 Supabase와 EmailJS에 브라우저에서 직접 연결합니다. 개발과 빌드에는 TypeScript·Vite를, 정적 앱 배포에는 Vercel을 사용합니다.</desc>
  <metadata>DOMADO 공개 문서용 도식. 텍스트와 도형으로 구성한 SVG. 연결 방향을 5.2초 주기로 반복해서 강조하며 실제 요청 시간이나 실행 순서를 뜻하지 않습니다. 감소 모션 환경에서는 정적으로 표시합니다.</metadata>
  <defs>
    <style>
      text { font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; letter-spacing: -.4px; }
      .code { font-family: "Menlo", "SFMono-Regular", Consolas, monospace; letter-spacing: -.3px; }

      .flow-trace {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0;
        stroke-dasharray: var(--dash) 130;
        stroke-dashoffset: var(--dash);
        animation: var(--flow-name) 5.2s cubic-bezier(.3,0,.3,1) infinite;
      }
      .flow-edge { stroke: #ffffff; stroke-width: 8; }
      .flow-core { stroke: var(--flow-color); stroke-width: 4.5; }

      @keyframes flow-1 {
        0%, 4.8077% { opacity: 0; stroke-dashoffset: 15; }
        6.8846% { opacity: 1; }
        19.3462% { opacity: 1; }
        22.1154%, 100% { opacity: 0; stroke-dashoffset: -100; }
      }

      @keyframes flow-2 {
        0%, 24.0385% { opacity: 0; stroke-dashoffset: 15; }
        26.1154% { opacity: 1; }
        38.5769% { opacity: 1; }
        41.3462%, 100% { opacity: 0; stroke-dashoffset: -100; }
      }

      @keyframes flow-3 {
        0%, 44.2308% { opacity: 0; stroke-dashoffset: 25; }
        45.3846% { opacity: 1; }
        52.3077% { opacity: 1; }
        53.8462%, 100% { opacity: 0; stroke-dashoffset: -100; }
      }

      @keyframes flow-4 {
        0%, 44.2308% { opacity: 0; stroke-dashoffset: 25; }
        45.3846% { opacity: 1; }
        52.3077% { opacity: 1; }
        53.8462%, 100% { opacity: 0; stroke-dashoffset: -100; }
      }

      @keyframes flow-5 {
        0%, 56.7308% { opacity: 0; stroke-dashoffset: 25; }
        58.2308% { opacity: 1; }
        67.2308% { opacity: 1; }
        69.2308%, 100% { opacity: 0; stroke-dashoffset: -100; }
      }

      @keyframes flow-6 {
        0%, 59.6154% { opacity: 0; stroke-dashoffset: 25; }
        61% { opacity: 1; }
        69.3077% { opacity: 1; }
        71.1538%, 100% { opacity: 0; stroke-dashoffset: -100; }
      }

      @keyframes flow-7 {
        0%, 74.0385% { opacity: 0; stroke-dashoffset: 25; }
        75.4231% { opacity: 1; }
        83.7308% { opacity: 1; }
        85.5769%, 100% { opacity: 0; stroke-dashoffset: -100; }
      }

      @media (prefers-reduced-motion: reduce) {
        .flow-trace { animation: none; opacity: 0; }
      }
    </style>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M2 1 8 5 2 9" fill="none" stroke="#1b64da" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
